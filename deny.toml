# cargo-deny: advisories, licences, bans, sources (ADR 0017).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # The core and the adapters never depend on Tauri (ADR 0002). Only the app shell may.
  { crate = "tauri", wrappers = ["culla-app"] },
  # Never memory-map files (removable media, design/file-engine.md).
  { crate = "memmap2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
