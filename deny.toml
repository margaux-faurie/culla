# cargo-deny: advisories, licences, bans, sources (ADR 0017).
[graph]
all-features = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # quick-xml 0.38 via plist 1.8 (tauri, tauri-utils, tauri-codegen). plist parses Apple
  # property lists (macOS Info.plist, build-time config); on Windows Culla never feeds it
  # user-controlled input, so these DoS issues are not reachable. Remove once plist moves
  # to quick-xml >= 0.41 (check on every Tauri update).
  { id = "RUSTSEC-2026-0194", reason = "quick-xml via plist: no untrusted XML reaches it on Windows" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml via plist: no untrusted XML reaches it on Windows" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
  # Tauri tree: cssparser, cssparser-macros, selectors and dtoa-short (via tauri-utils' HTML parser),
  # option-ext (via dirs). File-level copyleft on unmodified dependencies; fine in an MIT binary.
  "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # The core and the adapters never depend on Tauri (ADR 0002). Only the app shell may.
  # `culla-app` is the package name of src-tauri; Tauri plugins depend on tauri directly and are listed as they are added.
  { crate = "tauri", wrappers = ["culla-app", "tauri-plugin-updater"] },
  { crate = "tauri-plugin-updater", wrappers = ["culla-app"] },
  # Never memory-map files (removable media, design/file-engine.md).
  { crate = "memmap2" },
  # Crates that remove or move files on our behalf (design/file-engine.md §9.7).
  { crate = "remove_dir_all" },
  { crate = "fs_extra" },
  { crate = "trash" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
