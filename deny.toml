# cargo-deny: advisories, licences, bans, sources (ADR 0017, ADR 0026).
[graph]
all-features = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
]

# Weak copyleft is allowed per crate only, never globally (ADR 0017).
# Tauri tree: cssparser, cssparser-macros, selectors and dtoa-short (via tauri-utils' HTML parser),
# option-ext (via dirs). MPL-2.0 is file-level copyleft on unmodified dependencies: compatible with
# GPL-3.0 (MPL-2.0 §3.3), and the third-party licences file must list them.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
]

# Culla's own crates are GPL-3.0-only and unpublished (`publish = false`): skip their licence
# rather than allowing GPL globally, which would let GPL dependencies in (ADR 0026).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # The core and the adapters never depend on Tauri (ADR 0002). Only the app shell may.
  # `culla-app` is the package name of src-tauri; Tauri plugins depend on tauri directly and are listed as they are added.
  { crate = "tauri", wrappers = ["culla-app", "tauri-plugin-updater"] },
  { crate = "tauri-plugin-updater", wrappers = ["culla-app"] },
  # Never memory-map files (removable media, design/file-engine.md).
  { crate = "memmap2" },
  # Crates that remove or move files on our behalf (design/file-engine.md §9.7).
  { crate = "remove_dir_all" },
  { crate = "fs_extra" },
  { crate = "trash" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
