name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No merge-conflict markers
        run: scripts/ci/check-conflict-markers.sh
      - name: Removal lint only switched off where allowed
        run: python3 scripts/ci/check_lint_allows.py
      - name: culla-core has no I/O or Tauri dependencies
        run: scripts/ci/check-core-deps.sh

  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      # M0 exit: an exFAT VHDX mounts and a placeholder test writes to it. The full
      # detach and read-only spike is in vhdx-spike.yml (scripts/ci/README.md).
      - name: Mount exFAT test volume
        shell: pwsh
        timeout-minutes: 5
        run: pwsh -NoProfile -File scripts/ci/vhdx.ps1 -Action mount -Path "$env:RUNNER_TEMP\ci-t.vhdx" -SizeMB 64 -FileSystem exFAT -Letter T
      - name: Placeholder test on the exFAT volume
        shell: pwsh
        timeout-minutes: 10
        env:
          CULLA_VHDX_LETTER: T
        run: cargo test -p culla-adapters --test vhdx_spike --locked -- --ignored --exact vhdx_write_placeholder --nocapture
      - name: Unmount exFAT test volume
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: |
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP\ci-t.vhdx") {
            pwsh -NoProfile -File scripts/ci/vhdx.ps1 -Action unmount -Path "$env:RUNNER_TEMP\ci-t.vhdx"
          }

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories bans licenses sources
