name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No merge-conflict markers
        run: scripts/ci/check-conflict-markers.sh
      - name: Removal lint only switched off where allowed
        run: python3 scripts/ci/check_lint_allows.py
      - name: culla-core has no I/O or Tauri dependencies
        run: scripts/ci/check-core-deps.sh

  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain
      - name: rustfmt
        run: cargo fmt --all --check
      # culla-app (Tauri) links WebKitGTK on Linux; the product is Windows-only, so it is
      # linted and built in the Windows jobs.
      - name: clippy
        run: cargo clippy --workspace --exclude culla-app --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --exclude culla-app --locked
      - name: Synthetic fixtures match the generator
        run: cargo run -p xtask --locked -- fixtures --check
      - name: Golden fixtures are well formed
        run: cargo run -p xtask --locked -- golden --check

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      # M0 exit: an exFAT VHDX mounts and a placeholder test writes to it. The full
      # detach and read-only spike is in vhdx-spike.yml (scripts/ci/README.md).
      - name: Mount exFAT test volume
        shell: pwsh
        timeout-minutes: 5
        run: pwsh -NoProfile -File scripts/ci/vhdx.ps1 -Action mount -Path "$env:RUNNER_TEMP\ci-t.vhdx" -SizeMB 64 -FileSystem exFAT -Letter T
      - name: Placeholder test on the exFAT volume
        shell: pwsh
        timeout-minutes: 10
        env:
          CULLA_VHDX_LETTER: T
        run: cargo test -p culla-adapters --test vhdx_spike --locked -- --ignored --exact vhdx_write_placeholder --nocapture
      - name: Windows integration tests (windows-it)
        shell: pwsh
        timeout-minutes: 15
        env:
          CULLA_VHDX_LETTER: T
        run: cargo test -p culla-adapters --features windows-it --locked
      - name: Unmount exFAT test volume
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: |
          if (Test-Path -LiteralPath "$env:RUNNER_TEMP\ci-t.vhdx") {
            pwsh -NoProfile -File scripts/ci/vhdx.ps1 -Action unmount -Path "$env:RUNNER_TEMP\ci-t.vhdx"
          }

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories bans licenses sources

  js:
    name: JS (Biome, tsc, Vitest, demo build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check (Biome + tsc)
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Demo build
        run: pnpm build:demo

  e2e:
    name: End to end (Playwright, axe)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Demo build
        run: pnpm build:demo
      - name: End to end
        run: pnpm e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  app-windows:
    name: Tauri app (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the app (PR, no installer)
        if: github.event_name == 'pull_request'
        run: pnpm tauri build --ci --no-bundle -- --locked
      - name: Build the NSIS installer (main, not uploaded)
        if: github.event_name == 'push'
        run: pnpm tauri build --ci -- --locked
