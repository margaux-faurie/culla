name: release-please

# Opens and updates the release PR from Conventional Commits on main (ADR 0018).
# The release PR is merged by Margaux only: merging it tags the release.
# Agents never merge it.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Uses GITHUB_TOKEN for now. Events from that token trigger no workflows, so CI does not
          # run on the release PR and the release tag won't start the build. Before the first
          # release (M6), pass a GitHub App or fine-grained PAT token here from a secret
          # (Margaux's call), or re-run CI on the release PR by hand.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
