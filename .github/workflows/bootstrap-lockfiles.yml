name: Bootstrap lockfiles (temporary)

# One-off: produces pnpm-lock.yaml and the full Cargo.lock on a runner with network access,
# because the development container can't reach the registries. Remove this file once
# both lockfiles are committed.

on:
  pull_request:

permissions: {}

jobs:
  bootstrap:
    name: Bootstrap lockfiles
    runs-on: ubuntu-latest
    # Temporary: pushes the generated lockfiles back to this PR branch. Same-repo branches only.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'm0/app'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm-lock.yaml
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Cargo.lock
        run: cargo update --workspace
      - name: Commit the lockfiles to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml Cargo.lock
          if git diff --cached --quiet; then echo "Lockfiles unchanged."; exit 0; fi
          git commit -m "build: add lockfiles for the app shell (generated in CI)"
          git push origin "HEAD:${{ github.head_ref }}"
