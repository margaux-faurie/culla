name: Refresh pnpm-lock.yaml (temporary)

# One-off for PR #13: the dev container can't reach npm, so this resolves the lockfile for the
# new devDependencies on a runner and pushes it back to the branch. Removed again before merge.

on:
  pull_request:

permissions: {}

jobs:
  refresh:
    name: Refresh pnpm-lock.yaml
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'm0/tooling'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm-lock.yaml
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then echo "pnpm-lock.yaml unchanged."; exit 0; fi
          git commit -m "build: refresh pnpm-lock.yaml (generated in CI)"
          git push origin "HEAD:${{ github.head_ref }}"
