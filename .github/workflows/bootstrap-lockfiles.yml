name: Bootstrap lockfiles (temporary)

# One-off: produces pnpm-lock.yaml and the full Cargo.lock on a runner with network access,
# because the development container can't reach the registries. Remove this file once
# both lockfiles are committed.

on:
  pull_request:

permissions: {}

jobs:
  bootstrap:
    name: Bootstrap lockfiles
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm-lock.yaml
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Cargo.lock
        run: cargo update --workspace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lockfiles
          path: |
            pnpm-lock.yaml
            Cargo.lock
          if-no-files-found: error
          retention-days: 3
