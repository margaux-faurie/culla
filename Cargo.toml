[workspace]
resolver = "3"
members = ["crates/core", "crates/adapters", "crates/cli", "crates/bench"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/margaux-faurie/culla"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
disallowed_methods = "deny"
