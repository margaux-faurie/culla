[workspace]
resolver = "3"
members = ["crates/core", "crates/adapters", "crates/cli", "crates/bench", "src-tauri", "xtask"]
# cargo-fuzz needs nightly and libFuzzer; it is its own workspace (docs/testing.md §7).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0" # x-release-please-version
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/margaux-faurie/culla"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
# Warnings are denied in CI.
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
disallowed_methods = "deny"

# Profiles: no release profile may set `panic = "abort"`. Per-file isolation in
# crates/adapters/src/metadata/exif.rs relies on `catch_unwind`, so one malformed file cannot
# end the scan. Add profiles below this line with that in mind.
